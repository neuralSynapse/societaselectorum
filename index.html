<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oráculo Financeiro de THOTH</title><style>html,body{margin:0;min-height:100%;background:#070a12;color:#eee;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot small{opacity:.7}</style></head><body><div class="boot" id="boot"><div>Carregando o Oráculo Financeiro de THOTH…<br><small>V8 Consolidado</small></div></div><script>(async()=>{try{const files=Array.from({length:9},(_,i)=>`source/v8/part-${String(i).padStart(2,'0')}.txt`);let html='';for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(`Falha em ${f}: ${r.status}`);html+=await r.text()}document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div>Não foi possível carregar o funil.<br><small>'+String(e)+'</small></div>'}})();</script></body></html>
