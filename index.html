<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Oráculo Financeiro de THOTH — V9</title><style>html,body{margin:0;min-height:100%;background:#07050d;color:#f8efd9;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot small{opacity:.72;color:#d6b15a}</style></head><body><div class="boot" id="boot"><div>Carregando o Oráculo Financeiro de THOTH…<br><small>V9 · experiência em validação</small></div></div><script>(async()=>{try{const files=Array.from({length:9},(_,i)=>`source/v8/part-${String(i).padStart(2,'0')}.txt`);let html='';for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(`Falha em ${f}: ${r.status}`);html+=await r.text()}for(const patchFile of ['source/v9/patcher.js','source/v9/state-fix.js']){const pr=await fetch(patchFile,{cache:'no-store'});if(!pr.ok)throw new Error(`Falha em ${patchFile}: ${pr.status}`);(0,eval)(await pr.text())}if(typeof window.applyH93V9Patches!=='function'||typeof window.applyH93V9StateFixes!=='function')throw new Error('Camadas V9 não inicializadas');html=window.applyH93V9Patches(html);html=window.applyH93V9StateFixes(html);document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div>Não foi possível carregar o funil.<br><small>'+String(e)+'</small></div>'}})();</script></body></html>
