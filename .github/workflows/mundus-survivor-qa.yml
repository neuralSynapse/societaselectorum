name: MUNDUS Survivor QA

on:
  push:
    branches: [feat/mundus-game-hub-survivor-v1]
  pull_request:
    branches: [main]

jobs:
  survivor-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Static syntax and isolation checks
        shell: bash
        run: |
          set -euo pipefail
          node --check mundus/harun-survivor/js/data-v3.js
          node --check mundus/harun-survivor/js/art-v3.js
          node --check mundus/harun-survivor/js/engine-v3.js
          ! grep -R -E "harun-(peregrino|espectro-cinza|observador-cego|censor-cinzas|vidente-sal)-v1\\.(png|jpg|webp)" mundus/harun-survivor
          grep -q "mundus_harun_survivor_v3" mundus/harun-survivor/js/data-v3.js
          grep -q "renderer:'layered-2.5d'" mundus/harun-survivor/js/art-v3.js
          grep -q "window.HarunSurvivorDebug" mundus/harun-survivor/js/engine-v3.js

      - name: Start local immutable preview
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mundus-http.log 2>&1 &
          echo $! > /tmp/mundus-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/mundus/harun-survivor/index.html >/dev/null && exit 0; sleep .2; done
          cat /tmp/mundus-http.log
          exit 1

      - name: Browser gameplay smoke and visual capture
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo "No Chromium-compatible browser on runner"; exit 1; }
          echo "Browser: $BROWSER"
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --mute-audio --hide-scrollbars --window-size=540,960 --virtual-time-budget=14000 --dump-dom http://127.0.0.1:8765/mundus/harun-survivor/qa/smoke.html > /tmp/survivor-qa-dom.html
          STATUS="$(grep -o '<div id="status"[^>]*>[^<]*' /tmp/survivor-qa-dom.html | head -1 || true)"
          echo "$STATUS"
          [[ "$STATUS" == *"QA:PASS"* ]]
          [[ "$STATUS" != *"QA:FAIL"* ]]
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --mute-audio --hide-scrollbars --window-size=540,960 --virtual-time-budget=14000 --screenshot=/tmp/harun-survivor-qa.png http://127.0.0.1:8765/mundus/harun-survivor/qa/smoke.html
          test -s /tmp/harun-survivor-qa.png

      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harun-survivor-qa
          path: |
            /tmp/survivor-qa-dom.html
            /tmp/harun-survivor-qa.png
            /tmp/mundus-http.log
          if-no-files-found: warn
