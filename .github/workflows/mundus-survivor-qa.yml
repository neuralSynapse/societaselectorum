name: MUNDUS Survivor QA

on:
  push:
    branches: [feat/mundus-game-hub-survivor-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  survivor-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mundus-game-hub-survivor-v1

      - name: Apply boss warning runtime binding fix if needed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mundus/harun-survivor/js/engine-v3.js')
          s=p.read_text(encoding='utf-8')
          old="joystick:$('#joystick'),joystickKnob:$('#joystickKnob'),mastery:$('#mastery')};"
          new="joystick:$('#joystick'),joystickKnob:$('#joystickKnob'),mastery:$('#mastery'),danger:$('#danger')};"
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          elif new not in s:
              raise SystemExit('Expected UI binding pattern not found')
          PY
          if ! git diff --quiet -- mundus/harun-survivor/js/engine-v3.js; then
            git config user.name "MUNDUS QA Bot"
            git config user.email "actions@users.noreply.github.com"
            git add mundus/harun-survivor/js/engine-v3.js
            git commit -m "fix(survivor): bind danger overlay for boss warning"
            git push origin HEAD:feat/mundus-game-hub-survivor-v1
          fi

      - name: Static syntax and isolation checks
        shell: bash
        run: |
          set -euo pipefail
          node --check mundus/harun-survivor/js/data-v3.js
          node --check mundus/harun-survivor/js/art-v3.js
          node --check mundus/harun-survivor/js/engine-v3.js
          ! grep -R -E "harun-(peregrino|espectro-cinza|observador-cego|censor-cinzas|vidente-sal)-v1\\.(png|jpg|webp)" mundus/harun-survivor
          grep -q "mundus_harun_survivor_v3" mundus/harun-survivor/js/data-v3.js
          grep -q "renderer:'layered-2.5d'" mundus/harun-survivor/js/art-v3.js
          grep -q "danger:\$('#danger'\)" mundus/harun-survivor/js/engine-v3.js
          grep -q "window.HarunSurvivorDebug" mundus/harun-survivor/js/engine-v3.js

      - name: Start local immutable preview
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mundus-http.log 2>&1 &
          echo $! > /tmp/mundus-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/mundus/harun-survivor/index.html >/dev/null && exit 0; sleep .2; done
          cat /tmp/mundus-http.log
          exit 1

      - name: Install Playwright driver
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet playwright

      - name: Real-time browser gameplay and responsive QA
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo "No Chromium-compatible browser on runner"; exit 1; }
          QA_BROWSER="$BROWSER" QA_OUT=/tmp/harun-survivor-qa python3 mundus/harun-survivor/qa/playtest.py | tee /tmp/harun-survivor-qa.log
          grep -q '"status": "PASS"' /tmp/harun-survivor-qa/qa-report.json

      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harun-survivor-qa
          path: |
            /tmp/harun-survivor-qa/
            /tmp/harun-survivor-qa.log
            /tmp/mundus-http.log
          if-no-files-found: warn
