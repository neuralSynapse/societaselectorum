name: CHRONICA Front B Combat

on:
  push:
    branches:
      - feat/chronica-combat-entities
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GAME_DIR: game/chronica-harun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q pytest trimesh numpy
      - name: Generate entity models
        run: |
          python "$GAME_DIR/tools/generate_models.py"
          test "$(find "$GAME_DIR/art/generated/enemies" -name '*.glb' | wc -l)" -eq 82
          test "$(find "$GAME_DIR/art/generated/bosses" -name '*.glb' | wc -l)" -eq 16
      - name: Run pytest
        run: pytest -q "$GAME_DIR/tests"
      - name: Run canonical validators
        run: |
          python "$GAME_DIR/tools/validate_complete_game.py"
          python "$GAME_DIR/tools/validate_story_canon.py"
      - name: Install Godot 4.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Godot headless import
        run: |
          set -o pipefail
          godot --headless --path "$GAME_DIR" --editor --quit 2>&1 | tee /tmp/front-b-import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed" /tmp/front-b-import.log
      - name: Combat arena smoke
        run: |
          set +e
          timeout 10s godot --headless --path "$GAME_DIR" res://scenes/test/CombatEntityArena.tscn 2>&1 | tee /tmp/front-b-arena.log
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 && "$code" -ne 124 ]]; then exit "$code"; fi
          ! grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed|Invalid call|Invalid access" /tmp/front-b-arena.log
