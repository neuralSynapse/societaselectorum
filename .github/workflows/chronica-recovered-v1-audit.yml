name: CHRONICA Recovered Source v1 Audit

on:
  push:
    branches:
      - feat/chronica-foundation-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovered-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore v1 handoff package
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin handoff/chronica-godot-real-source-2026-09-07
          REF='origin/handoff/chronica-godot-real-source-2026-09-07'
          PATH_IN_GIT='chronica-handoff/CHRONICA_HARUN_FRONT_B_SOURCE_MIN_2026-09-07.tar.gz.b64'
          test "$(git rev-parse "${REF}:${PATH_IN_GIT}")" = 'ccea3bf163f3f48eefde695f8ca9a1e8ceb62db6'
          git show "${REF}:${PATH_IN_GIT}" > /tmp/source.b64
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          text = Path('/tmp/source.b64').read_text(encoding='ascii')
          compact = ''.join(text.split())
          bad = sorted(set(re.sub(r'[A-Za-z0-9+/=]', '', compact)))
          print('base64_bytes=', len(text.encode()))
          print('base64_compact_length=', len(compact))
          print('base64_length_mod_4=', len(compact) % 4)
          print('base64_invalid_chars=', repr(bad))
          print('base64_sha256=', hashlib.sha256(text.encode()).hexdigest())
          print('base64_tail=', repr(compact[-64:]))
          if bad or len(compact) % 4:
              raise SystemExit('v1 handoff package is not valid base64')
          raw = base64.b64decode(compact, validate=True)
          print('decoded_bytes=', len(raw))
          print('decoded_sha256=', hashlib.sha256(raw).hexdigest())
          Path('/tmp/source.tar.gz').write_bytes(raw)
          PY
          gzip -t /tmp/source.tar.gz
          mkdir -p /tmp/recovered
          tar -xzf /tmp/source.tar.gz -C /tmp/recovered
          test -f /tmp/recovered/project.godot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate recovery content
        working-directory: /tmp/recovered
        run: |
          set -euxo pipefail
          python tools/generate_recovered_content.py
          python tools/generate_models.py

      - name: Pytest recovered v1
        working-directory: /tmp/recovered
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q

      - name: Verify required paths
        working-directory: /tmp/recovered
        run: |
          set -euxo pipefail
          for f in project.godot autoload/GameState.gd autoload/SaveService.gd autoload/RogueliteContentService.gd scripts/progression/StageDirector.gd scripts/generation/StageFloorBuilder.gd scripts/content/BuildResolver.gd scripts/content/PowerMutationRuntime.gd scripts/content/DaimonRuntime.gd scripts/rooms/SpecialRoomDirector.gd scripts/vision/VisionDirector.gd scripts/meta/MetaRunDirector.gd data/stages/student_journey.json data/enemies/student_enemies.json data/bosses/student_bosses.json; do test -f "$f"; done
          test -d data/roguelite
          test -d scenes/player
          test -d scenes/enemies
          test -d scenes/bosses

      - name: Install Godot 4.5.1
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --version

      - name: Godot import recovered v1
        run: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path /tmp/recovered --editor --quit

      - name: Godot boot recovered v1
        run: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path /tmp/recovered --quit-after 5
