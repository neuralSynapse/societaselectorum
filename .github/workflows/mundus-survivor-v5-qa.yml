name: MUNDUS Survivor V5 QA

on:
  push:
    branches: [feat/harun-survivor-v5-epic-ingressus]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  survivor-v5-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Static V5 contracts
        shell: bash
        run: |
          set -euo pipefail
          for f in progression-v5 systems-v5 world-v5 runtime-v5 blackbook-v5 audio-v5; do
            node --check "mundus/harun-survivor/js/$f.js"
          done
          grep -Fq "version:'5.0.0'" mundus/harun-survivor/js/progression-v5.js
          grep -Fq "tarot.length!==78" mundus/harun-survivor/js/systems-v5.js
          grep -Fq "Heru-pa-khered" mundus/harun-survivor/js/progression-v5.js
          grep -Fq "ACTUS INGRESSUS" mundus/harun-survivor/js/progression-v5.js
          grep -Fq "institutionalWrite:false" mundus/harun-survivor/js/progression-v5.js
          grep -Fq "mundus-audio-core-v1.js" mundus/harun-survivor/v5.html
          grep -Fq "survivor-v5.css" mundus/harun-survivor/v5.html
          python3 -m py_compile mundus/harun-survivor/qa/playtest-v5.py mundus/harun-survivor/qa/smoke-live-v5.py

      - name: Start local V5 preview
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mundus-v5-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/mundus/harun-survivor/v5.html >/dev/null && exit 0; sleep .2; done
          cat /tmp/mundus-v5-http.log
          exit 1

      - name: Install Playwright driver
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet playwright

      - name: Run V5 real-time browser QA
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo "No Chromium-compatible browser on runner"; exit 1; }
          QA_BROWSER="$BROWSER" QA_OUT=/tmp/harun-survivor-v5-qa python3 mundus/harun-survivor/qa/playtest-v5.py | tee /tmp/harun-survivor-v5-qa.log
          grep -q '"status": "PASS"' /tmp/harun-survivor-v5-qa/qa-report-v5.json

      - name: Smoke test published WebsitePublisher RC
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          QA_BROWSER="$BROWSER" QA_OUT=/tmp/harun-survivor-v5-live QA_URL="https://project27912.websitepublisher.ai/harun-survivor-v5.html?debug=1" python3 mundus/harun-survivor/qa/smoke-live-v5.py | tee /tmp/harun-survivor-v5-live.log
          grep -q '"status": "PASS"' /tmp/harun-survivor-v5-live/live-smoke-report.json

      - name: Smoke test canonical WebsitePublisher route
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          QA_BROWSER="$BROWSER" QA_OUT=/tmp/harun-survivor-v5-canonical QA_URL="https://project27912.websitepublisher.ai/harun-survivor.html?debug=1" python3 mundus/harun-survivor/qa/smoke-live-v5.py | tee /tmp/harun-survivor-v5-canonical.log
          grep -q '"status": "PASS"' /tmp/harun-survivor-v5-canonical/live-smoke-report.json

      - name: Preserve V5 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harun-survivor-v5-qa
          path: |
            /tmp/harun-survivor-v5-qa/
            /tmp/harun-survivor-v5-qa.log
            /tmp/harun-survivor-v5-live/
            /tmp/harun-survivor-v5-live.log
            /tmp/harun-survivor-v5-canonical/
            /tmp/harun-survivor-v5-canonical.log
            /tmp/mundus-v5-http.log
          if-no-files-found: warn
