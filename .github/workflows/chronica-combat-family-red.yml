name: CHRONICA Combat Family Diversity RED

on:
  workflow_dispatch:
  push:
    branches: [feat/chronica-combat-v2]
    paths: ['.github/workflows/chronica-combat-family-red.yml']

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chronica-combat-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - run: pytest -q game/chronica-harun/tests/test_enemy_family_runtime_diversity.py
