name: CHRONICA Combat Definitive v1

on:
  workflow_dispatch:
  push:
    branches: [feat/chronica-combat-definitive-v1, feat/chronica-initiatic-roguelite-v2]
    paths:
      - 'game/chronica-harun/**'
      - '.github/workflows/chronica-combat-definitive-v1.yml'

permissions:
  contents: read

env:
  GAME_DIR: game/chronica-harun

jobs:
  definitive-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python contracts and validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest trimesh numpy
          python "$GAME_DIR/tools/generate_models.py"
          pytest -q "$GAME_DIR/tests" | tee /tmp/pytest.log
          python "$GAME_DIR/tools/validate_complete_game.py" | tee /tmp/complete.log
          python "$GAME_DIR/tools/validate_story_canon.py" | tee /tmp/story.log

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version | tee /tmp/godot-version.log

      - name: Strict Godot import
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GAME_DIR" --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed|Invalid call|Invalid access|Trying to assign value' /tmp/import.log

      - name: Main boot smoke
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 14s godot --headless --path "$GAME_DIR" res://scenes/boot/Main.tscn 2>&1 | tee /tmp/boot.log
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 && "$code" -ne 124 ]]; then exit "$code"; fi
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed|Invalid call|Invalid access|Trying to assign value' /tmp/boot.log

      - name: Export browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GAME_DIR/build/web"
          godot --headless --path "$GAME_DIR" --export-release "Web" "build/web/index.html" 2>&1 | tee /tmp/web-export.log
          test -s "$GAME_DIR/build/web/index.html"
          test -s "$GAME_DIR/build/web/index.wasm"
          test -s "$GAME_DIR/build/web/index.pck"

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: chronica-combat-definitive-web
          path: game/chronica-harun/build/web/
          if-no-files-found: error

      - name: Prepare playable Pages preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chronica-pages
          mkdir -p /tmp/chronica-pages/chronica-harun-definitive
          cp -a "$GAME_DIR/build/web/." /tmp/chronica-pages/chronica-harun-definitive/
          cat > /tmp/chronica-pages/index.html <<'EOF'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./chronica-harun-definitive/"><title>CHRONICA HARUN</title></head><body><a href="./chronica-harun-definitive/">Abrir CHRONICA HARUN</a></body></html>
          EOF
          test -s /tmp/chronica-pages/chronica-harun-definitive/index.html
          test -s /tmp/chronica-pages/chronica-harun-definitive/index.wasm
          test -s /tmp/chronica-pages/chronica-harun-definitive/index.pck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/chronica-pages

      - name: Definitive visual capture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          rm -rf /tmp/chronica-definitive
          mkdir -p /tmp/chronica-definitive
          xvfb-run -a -s "-screen 0 1920x1080x24" godot --path "$GAME_DIR" res://runtime_qa/DefinitiveVisualProbe.tscn 2>&1 | tee /tmp/visual.log
          grep -q 'DEFINITIVE_VISUAL_CAPTURE=PASS' /tmp/visual.log
          test -s /tmp/chronica-definitive/definitive_visual.png

      - name: Upload definitive visual
        uses: actions/upload-artifact@v4
        with:
          name: chronica-combat-definitive-visual
          path: /tmp/chronica-definitive/definitive_visual.png
          if-no-files-found: error

      - name: Definitive contract gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'passed' /tmp/pytest.log
          grep -q 'COMPLETE GAME VALIDATION: PASS' /tmp/complete.log
          grep -q 'CHRONICA STORY CANON VALIDATION: PASS' /tmp/story.log
          grep -q 'DEFINITIVE_VISUAL_CAPTURE=PASS' /tmp/visual.log
          test -s /tmp/chronica-definitive/definitive_visual.png
          test -s "$GAME_DIR/build/web/index.html"
          test -s "$GAME_DIR/build/web/index.wasm"
          test -s "$GAME_DIR/build/web/index.pck"
          test -s /tmp/chronica-pages/chronica-harun-definitive/index.html
          grep -q 'DefinitivePowerRuntime' "$GAME_DIR/project.godot"
          grep -q 'foundation_hammer_base' "$GAME_DIR/autoload/DefinitivePowerRuntime.gd"
          grep -q 'memoria_ignis_base' "$GAME_DIR/autoload/DefinitivePowerRuntime.gd"
          echo CHRONICA_COMBAT_DEFINITIVE_V1_GREEN=PASS

  deploy-web-preview:
    needs: definitive-green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: chronica-preview
      url: ${{ steps.deployment.outputs.page_url }}chronica-harun-definitive/
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy playable preview
        id: deployment
        uses: actions/deploy-pages@v4
