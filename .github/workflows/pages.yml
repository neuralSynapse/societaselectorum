name: Deploy H93 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build V10 base
        run: node scripts/build-v10.mjs
      - name: Apply V10.2 baseline
        run: python3 scripts/patch-v10-2.py
      - name: Apply V11
        run: node scripts/apply-v11.mjs
      - name: Apply V11.1 personalization base
        run: node scripts/apply-v11-1.mjs
      - name: Apply V11.2 simplified UX
        run: node scripts/apply-v11-2.mjs
      - name: Validate V11.2
        run: node scripts/validate-v11-2.mjs
      - name: Smoke V11.2 runtime
        run: node scripts/smoke-v11-2.mjs
      - name: Finalize canonical public build
        run: node scripts/finalize-oraculo.mjs
      - name: Validate canonical production build
        run: node scripts/validate-final.mjs
      - name: Smoke canonical lead capture
        run: node scripts/smoke-final.mjs
      - name: Smoke iframe lead bridge
        run: node scripts/smoke-iframe-bridge.mjs
      - name: Apply V12 secure automation
        run: node scripts/apply-v12.mjs
      - name: Repair V12 body placement
        run: node scripts/fix-v12-body.mjs
      - name: Neutralize legacy post-purchase UI
        run: node scripts/cleanup-v12-commerce.mjs
      - name: Enable V12 Stripe checkout button
        run: node scripts/fix-v12-checkout-button.mjs
      - name: Validate V12 secure automation
        run: node scripts/validate-v12.mjs
      - name: Prepare canonical static site
        run: |
          rm -rf _site
          mkdir -p _site/config
          cp dist/oraculo.html _site/oraculo.html
          cp config/checkout.json _site/config/checkout.json
          cp robots.txt _site/robots.txt
          cat > /tmp/oraculo-redirect.html <<'EOF'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0;url=oraculo.html"><link rel="canonical" href="oraculo.html"><title>Oráculo Financeiro de THOTH</title><script>location.replace('oraculo.html'+location.search+location.hash)</script></head><body><a href="oraculo.html">Abrir Oráculo Financeiro de THOTH</a></body></html>
          EOF
          cp /tmp/oraculo-redirect.html _site/index.html
          cp /tmp/oraculo-redirect.html _site/oraculo-v10.html
          cp /tmp/oraculo-redirect.html _site/oraculo-v11.html
          cp /tmp/oraculo-redirect.html _site/oraculo-v11-1.html
          cp /tmp/oraculo-redirect.html _site/oraculo-v11-2.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
