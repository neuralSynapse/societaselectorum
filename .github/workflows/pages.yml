name: Deploy H93 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build V10 base
        run: node scripts/build-v10.mjs
      - name: Apply V10.2 baseline
        run: python3 scripts/patch-v10-2.py
      - name: Apply V11
        run: node scripts/apply-v11.mjs
      - name: Apply V11.1 global personalization
        run: node scripts/apply-v11-1.mjs
      - name: Validate V11.1
        run: node scripts/validate-v11-1.mjs
      - name: Smoke V11.1 runtime
        run: node scripts/smoke-v11-1.mjs
      - name: Prepare immutable static site
        run: |
          rm -rf _site
          mkdir -p _site/config
          cp dist/index.html _site/index.html
          cp dist/index.html _site/oraculo-v11-1.html
          cp dist/index.html _site/oraculo-v11.html
          cp dist/index.html _site/oraculo-v10.html
          cp config/checkout.json _site/config/checkout.json
          cp robots.txt _site/robots.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
