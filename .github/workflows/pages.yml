name: Deploy H93 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate V9 assembly and regressions
        run: node scripts/validate-v9.mjs
      - name: Smoke test first frame and card runtime
        run: node scripts/smoke-runtime.mjs
      - name: Prepare immutable static site
        run: |
          rm -rf _site
          mkdir -p _site/config
          cp dist/index.html _site/index.html
          cp dist/index.html _site/oraculo-v94.html
          cp dist/index.html _site/oraculo-v95.html
          cp config/checkout.json _site/config/checkout.json
          cp robots.txt _site/robots.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
