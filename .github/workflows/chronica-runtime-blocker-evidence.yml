name: CHRONICA Runtime Blocker Evidence

on:
  push:
    branches:
      - fix/chronica-runtime-qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blocker-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/chronica-runtime-qa

      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Install Godot 4.3 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 --fail -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p runtime-qa/logs
          godot --version | tee runtime-qa/logs/godot-version.txt

      - name: Verify v4 manifest availability
        id: verify
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess

          manifest_path = pathlib.Path('handoff/chronica-playable/v4/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          objects = subprocess.check_output(['git','rev-list','--objects','--all'], text=True).splitlines()
          by_name = {c['name']: [] for c in manifest['chunks']}
          for line in objects:
              parts = line.split(' ',1)
              if len(parts) != 2:
                  continue
              sha,path = parts
              name = pathlib.PurePosixPath(path).name
              if name in by_name:
                  by_name[name].append((sha,path))

          rows=[]
          missing=[]
          for c in manifest['chunks']:
              found=[]
              for sha,path in by_name[c['name']]:
                  try:
                      raw=subprocess.check_output(['git','cat-file','blob',sha], stderr=subprocess.DEVNULL)
                      data=base64.b64decode(''.join(raw.decode('utf-8').split()), validate=True)
                  except Exception:
                      continue
                  found.append({'blob':sha,'path':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              exact=[x for x in found if x['bytes']==int(c['decoded_bytes']) and x['sha256']==c['sha256']]
              row={'chunk':c['name'],'expected_bytes':c['decoded_bytes'],'expected_sha256':c['sha256'],'exact_found':bool(exact),'exact':exact,'observed':found}
              rows.append(row)
              if not exact:
                  missing.append(row)

          report={
              'manifest':str(manifest_path),
              'archive_sha256':manifest['archive_sha256'],
              'archive_bytes':manifest['archive_bytes'],
              'source_head':manifest.get('source_head'),
              'missing_count':len(missing),
              'missing':missing,
              'chunks':rows,
          }
          pathlib.Path('runtime-qa').mkdir(exist_ok=True)
          pathlib.Path('runtime-qa/handoff-verification.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps({'missing_count':len(missing),'missing':[m['chunk'] for m in missing]},indent=2))
          raise SystemExit(1 if missing else 0)
          PY
          code=$?
          echo "$code" > runtime-qa/logs/handoff-verification.exit
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write blocker report
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          qa=pathlib.Path('runtime-qa')
          r=json.loads((qa/'handoff-verification.json').read_text())
          version=(qa/'logs/godot-version.txt').read_text().strip()
          missing=r['missing']
          lines=[
            '# CHRONICA HARUN · Runtime QA external blocker',
            '',
            f'- QA branch: `fix/chronica-runtime-qa`',
            f'- Godot QA binary: `{version}`',
            f'- v4 manifest archive SHA-256: `{r["archive_sha256"]}`',
            f'- v4 manifest archive bytes: `{r["archive_bytes"]}`',
            f'- Manifest source_head: `{r.get("source_head")}`',
            f'- Missing manifest-verifiable chunks in all reachable Git refs/history: `{r["missing_count"]}`',
            '',
            '## Missing chunks',
          ]
          for m in missing:
              lines.append(f'- `{m["chunk"]}` expected `{m["expected_sha256"]}` / {m["expected_bytes"]} bytes')
              for obs in m['observed']:
                  lines.append(f'  - observed `{obs["sha256"]}` / {obs["bytes"]} bytes at `{obs["path"]}` blob `{obs["blob"]}`')
          lines += [
            '',
            '## Consequence',
            'The priority v4 tar.xz cannot be reconstructed according to its governing manifest. Therefore `project.godot`, pytest, Godot import, boot smoke and runtime playability cannot be truthfully executed against v4 until an exact missing chunk or the complete source archive/tree is restored.',
            '',
            'No gameplay/runtime production files were modified by this QA branch.',
          ]
          (qa/'BLOCKER.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Persist blocker evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chronica-runtime-qa-bot'
          git config user.email 'chronica-runtime-qa-bot@users.noreply.github.com'
          git add runtime-qa/BLOCKER.md runtime-qa/handoff-verification.json runtime-qa/logs/godot-version.txt runtime-qa/logs/handoff-verification.exit
          if ! git diff --cached --quiet; then
            git commit -m 'test: persist v4 runtime blocker evidence'
            git push origin HEAD:fix/chronica-runtime-qa
          fi

      - name: Fail on external source blocker
        shell: bash
        run: |
          code=$(cat runtime-qa/logs/handoff-verification.exit)
          if [ "$code" != "0" ]; then
            echo 'BLOCKER: priority v4 source cannot be reconstructed from manifest-verifiable chunks.'
            exit 1
          fi
