name: CHRONICA Real Playability Gate

on:
  push:
    branches:
      - fix/chronica-playable-runtime-v6-2026-09-08
    paths:
      - '.github/workflows/chronica-real-playability-gate.yml'
      - 'game/chronica-harun/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GAME_DIR: game/chronica-harun
  GODOT_VERSION: '4.3'

jobs:
  playability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -q pytest trimesh numpy

      - name: Generate required enemy and boss GLBs
        shell: bash
        run: |
          set -euo pipefail
          python "$GAME_DIR/tools/generate_models.py"
          test "$(find "$GAME_DIR/art/generated/enemies" -name '*.glb' | wc -l)" -eq 82
          test "$(find "$GAME_DIR/art/generated/bosses" -name '*.glb' | wc -l)" -eq 16

      - name: Run Python regression suite
        run: pytest -q "$GAME_DIR/tests"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project and reject parser/runtime load errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GAME_DIR" --editor --quit 2>&1 | tee /tmp/chronica-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed" /tmp/chronica-import.log; then
            echo 'Blocking Godot import error.' >&2
            exit 1
          fi

      - name: Run real movement collision fall and ESC gate
        id: runtime_gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 40s godot --headless --path "$GAME_DIR" -s res://tests/runtime_playability_gate.gd 2>&1 | tee /tmp/chronica-playability.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi
          grep -q 'CHRONICA_REAL_PLAYABILITY_GATE_OK' /tmp/chronica-playability.log || exit 1
          if grep -q 'PLAYABILITY_GATE_FAIL' /tmp/chronica-playability.log; then
            exit 1
          fi

      - name: Persist gate diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-v6
          {
            echo '# CHRONICA real playability gate · latest diagnostic'
            echo
            echo "- head: $GITHUB_SHA"
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- runtime exit code: ${{ steps.runtime_gate.outputs.exit_code }}"
            echo
            echo '```text'
            if [[ -f /tmp/chronica-playability.log ]]; then
              tail -n 220 /tmp/chronica-playability.log
            else
              echo 'runtime gate did not start; inspect earlier workflow steps'
            fi
            echo '```'
          } > runtime-v6/PLAYABILITY_GATE_LAST.md
          git config user.name 'chronica-qa-bot'
          git config user.email 'chronica-qa-bot@users.noreply.github.com'
          git add runtime-v6/PLAYABILITY_GATE_LAST.md
          if ! git diff --cached --quiet; then
            git commit -m 'test: record latest real playability gate diagnostic'
            git push origin HEAD:fix/chronica-playable-runtime-v6-2026-09-08
          fi
