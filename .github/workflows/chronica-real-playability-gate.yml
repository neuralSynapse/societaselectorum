name: CHRONICA Real Playability Gate

on:
  push:
    branches:
      - fix/chronica-playable-runtime-v6-2026-09-08
    paths:
      - '.github/workflows/chronica-real-playability-gate.yml'
      - 'game/chronica-harun/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GAME_DIR: game/chronica-harun
  GODOT_VERSION: '4.3'

jobs:
  playability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -q pytest trimesh numpy

      - name: Generate required enemy and boss GLBs
        shell: bash
        run: |
          set -euo pipefail
          python "$GAME_DIR/tools/generate_models.py"
          test "$(find "$GAME_DIR/art/generated/enemies" -name '*.glb' | wc -l)" -eq 82
          test "$(find "$GAME_DIR/art/generated/bosses" -name '*.glb' | wc -l)" -eq 16

      - name: Run Python regression suite
        run: pytest -q "$GAME_DIR/tests"

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project and reject parser/runtime load errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GAME_DIR" --editor --quit 2>&1 | tee /tmp/chronica-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed" /tmp/chronica-import.log; then
            echo 'Blocking Godot import error.' >&2
            exit 1
          fi

      - name: Run real movement collision fall and ESC gate
        id: runtime_gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 40s godot --headless --path "$GAME_DIR" res://tests/RuntimePlayabilityGate.tscn 2>&1 | tee /tmp/chronica-playability.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi
          grep -q 'CHRONICA_REAL_PLAYABILITY_GATE_OK' /tmp/chronica-playability.log || exit 1
          if grep -q 'PLAYABILITY_GATE_FAIL' /tmp/chronica-playability.log; then exit 1; fi

      - name: Run canonical O OLHO initial weapon gate
        id: initial_weapon_gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 45s godot --headless --path "$GAME_DIR" res://tests/InitialWeaponGate.tscn 2>&1 | tee /tmp/chronica-initial-weapon.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi
          grep -q 'CHRONICA_INITIAL_WEAPON_GATE_OK' /tmp/chronica-initial-weapon.log || exit 1
          if grep -q 'INITIAL_WEAPON_GATE_FAIL' /tmp/chronica-initial-weapon.log; then exit 1; fi

      - name: Run full-scene death recovery gate
        id: death_recovery_gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 25s godot --headless --path "$GAME_DIR" res://tests/DeathRecoveryGate.tscn 2>&1 | tee /tmp/chronica-death-recovery.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi
          grep -q 'CHRONICA_DEATH_RECOVERY_GATE_OK' /tmp/chronica-death-recovery.log || exit 1
          if grep -q 'DEATH_RECOVERY_GATE_FAIL' /tmp/chronica-death-recovery.log; then exit 1; fi

      - name: Run O OLHO full stage completion gate
        id: stage_completion_gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 35s godot --headless --path "$GAME_DIR" res://tests/StageCompletionGate.tscn 2>&1 | tee /tmp/chronica-stage-completion.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" -ne 0 ]]; then exit "$code"; fi
          grep -q 'CHRONICA_STAGE_COMPLETION_GATE_OK' /tmp/chronica-stage-completion.log || exit 1
          if grep -q 'STAGE_COMPLETION_GATE_FAIL' /tmp/chronica-stage-completion.log; then exit 1; fi

      - name: Prepare gate diagnostic artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chronica-diagnostics
          {
            echo '# CHRONICA real playability gate · diagnostic'
            echo
            echo "- head: $GITHUB_SHA"
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- runtime exit code: ${{ steps.runtime_gate.outputs.exit_code }}"
            echo "- initial weapon gate exit code: ${{ steps.initial_weapon_gate.outputs.exit_code }}"
            echo "- death recovery gate exit code: ${{ steps.death_recovery_gate.outputs.exit_code }}"
            echo "- stage completion gate exit code: ${{ steps.stage_completion_gate.outputs.exit_code }}"
            echo
            echo '## Runtime playability'
            echo '```text'
            if [[ -f /tmp/chronica-playability.log ]]; then tail -n 200 /tmp/chronica-playability.log; else echo 'runtime gate did not start'; fi
            echo '```'
            echo
            echo '## O OLHO initial weapon gate'
            echo '```text'
            if [[ -f /tmp/chronica-initial-weapon.log ]]; then tail -n 200 /tmp/chronica-initial-weapon.log; else echo 'initial weapon gate did not start'; fi
            echo '```'
            echo
            echo '## Death recovery gate'
            echo '```text'
            if [[ -f /tmp/chronica-death-recovery.log ]]; then tail -n 120 /tmp/chronica-death-recovery.log; else echo 'death recovery gate did not start'; fi
            echo '```'
            echo
            echo '## O OLHO stage completion gate'
            echo '```text'
            if [[ -f /tmp/chronica-stage-completion.log ]]; then tail -n 160 /tmp/chronica-stage-completion.log; else echo 'stage completion gate did not start'; fi
            echo '```'
          } > /tmp/chronica-diagnostics/PLAYABILITY_GATE.md
          cp /tmp/chronica-import.log /tmp/chronica-diagnostics/import.log 2>/dev/null || true
          cp /tmp/chronica-playability.log /tmp/chronica-diagnostics/playability.log 2>/dev/null || true
          cp /tmp/chronica-initial-weapon.log /tmp/chronica-diagnostics/initial-weapon.log 2>/dev/null || true
          cp /tmp/chronica-death-recovery.log /tmp/chronica-diagnostics/death-recovery.log 2>/dev/null || true
          cp /tmp/chronica-stage-completion.log /tmp/chronica-diagnostics/stage-completion.log 2>/dev/null || true

      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHRONICA-PLAYABILITY-DIAGNOSTICS
          path: /tmp/chronica-diagnostics/
          if-no-files-found: error
          retention-days: 14
