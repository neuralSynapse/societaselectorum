name: MUNDUS Game Sentinel

on:
  push:
    branches:
      - agent/mundus-game-sentinel-v1
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python QA dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Unit tests
        run: pytest -q ops/mundus-game-sentinel/tests
      - name: Canon parity gate
        run: python ops/mundus-game-sentinel/validate_canon.py
      - name: State machine gate
        run: python ops/mundus-game-sentinel/sentinel.py check
      - name: Prepare artifacts
        run: mkdir -p ops/mundus-game-sentinel/artifacts
      - name: Live HTTP and critical assets
        run: python ops/mundus-game-sentinel/smoke_http.py --out ops/mundus-game-sentinel/artifacts/http-smoke.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser QA dependencies
        working-directory: ops/mundus-game-sentinel
        run: |
          npm install --no-fund
          npm audit --audit-level=critical
          npx playwright install --with-deps chromium
      - name: Browser and device-matrix smoke
        working-directory: ops/mundus-game-sentinel
        timeout-minutes: 8
        run: npm test
      - name: Upload sentinel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundus-game-sentinel-${{ github.run_id }}
          path: ops/mundus-game-sentinel/artifacts
          if-no-files-found: warn
          retention-days: 14
