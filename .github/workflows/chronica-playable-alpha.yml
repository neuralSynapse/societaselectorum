name: CHRONICA Playable Alpha

on:
  push:
    branches:
      - release/chronica-playable-alpha-2026-09-07
    paths:
      - 'handoff/chronica-playable/**'
      - '.github/workflows/chronica-playable-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.3'
  GAME_DIR: game/chronica-harun

jobs:
  validate-build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore canonical recovered source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GAME_DIR"
          tar -xzf handoff/chronica-playable/chronica-source.tar.gz -C "$GAME_DIR"
          echo "136f83f3bd76ba1fa4d69f9188a6d3ea0eb725dc40156cef8b2a1e70f4964f40  handoff/chronica-playable/chronica-source.tar.gz" | sha256sum -c -
          test -f "$GAME_DIR/project.godot"
          test -f "$GAME_DIR/scenes/boot/Main.tscn"
          test -f "$GAME_DIR/scripts/player/PlayerController.gd"
          test -f "$GAME_DIR/data/stages/student_journey.json"
      - name: Install Python validation/model dependencies
        run: python -m pip install --disable-pip-version-check pytest trimesh numpy
      - name: Regenerate canonical content and GLB assets
        shell: bash
        run: |
          set -euo pipefail
          python "$GAME_DIR/tools/generate_recovered_content.py"
          python "$GAME_DIR/tools/generate_models.py"
          test "$(find "$GAME_DIR/art/generated/enemies" -name '*.glb' | wc -l)" -eq 82
          test "$(find "$GAME_DIR/art/generated/bosses" -name '*.glb' | wc -l)" -eq 16
      - name: Run Python contract suite
        run: pytest -q "$GAME_DIR/tests"
      - name: Install Godot 4.3 and Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          ln -sf /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          rm -rf /tmp/export_templates
          mkdir -p /tmp/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/export_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a /tmp/export_templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version
      - name: Import complete Godot project headless
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GAME_DIR" --editor --quit 2>&1 | tee /tmp/chronica-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource" /tmp/chronica-import.log; then exit 1; fi
      - name: Boot playable main scene smoke
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 8s godot --headless --path "$GAME_DIR" res://scenes/boot/Main.tscn 2>&1 | tee /tmp/chronica-boot.log
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 && "$code" -ne 124 ]]; then exit "$code"; fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|Invalid get index|Attempt to call function" /tmp/chronica-boot.log; then exit 1; fi
          echo "CHRONICA_PLAYABLE_BOOT_OK"
      - name: Export Windows executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GAME_DIR/build/windows"
          godot --headless --path "$GAME_DIR" --export-release "Windows Desktop" build/windows/CHRONICA_HARUN.exe 2>&1 | tee /tmp/chronica-export.log
          test -s "$GAME_DIR/build/windows/CHRONICA_HARUN.exe"
          sha256sum "$GAME_DIR/build/windows/CHRONICA_HARUN.exe" | tee "$GAME_DIR/build/windows/CHRONICA_HARUN.exe.sha256"
      - name: Package Windows build
        shell: bash
        run: |
          set -euo pipefail
          cd "$GAME_DIR/build/windows"
          zip -9 CHRONICA_HARUN_WINDOWS_ALPHA.zip CHRONICA_HARUN.exe CHRONICA_HARUN.exe.sha256
      - name: Upload playable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHRONICA_HARUN_WINDOWS_ALPHA
          path: game/chronica-harun/build/windows/CHRONICA_HARUN_WINDOWS_ALPHA.zip
          if-no-files-found: error
          retention-days: 30
