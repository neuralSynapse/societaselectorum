name: CHRONICA Foundation Audit

on:
  push:
    branches:
      - feat/chronica-foundation-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository state
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --all --prune
          git status
          git branch -a
          git log --oneline --decorate -30
          git remote -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Pytest full repository
        run: python -m pytest -q

      - name: Existing Chronica backend tests
        run: node --test mundus/chronica-harun/backend/auth-controller-v1.test.js

      - name: Install Godot 4.5.1 stable
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --version

      - name: Godot headless import validation
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 \
            --headless \
            --path godot/chronica_harun \
            --editor --quit

      - name: Godot boot smoke test
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 \
            --headless \
            --path godot/chronica_harun \
            --quit-after 5

  source-discovery-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit every remote branch and historical object claim
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --all --prune
          python - <<'PY'
          import json
          import subprocess

          def run(*args, check=True):
              p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and p.returncode:
                  raise SystemExit(f"command failed: {args}\n{p.stderr}")
              return p

          target_suffixes = [
              'project.godot',
              'autoload/GameState.gd',
              'autoload/SaveService.gd',
              'autoload/RogueliteContentService.gd',
              'scripts/progression/StageDirector.gd',
              'scripts/generation/StageFloorBuilder.gd',
              'scripts/content/BuildResolver.gd',
              'scripts/content/PowerMutationRuntime.gd',
              'scripts/content/DaimonRuntime.gd',
              'scripts/rooms/SpecialRoomDirector.gd',
              'scripts/vision/VisionDirector.gd',
              'scripts/meta/MetaRunDirector.gd',
              'data/stages/student_journey.json',
              'data/enemies/student_enemies.json',
              'data/bosses/student_bosses.json',
          ]
          dir_fragments = [
              '/data/roguelite/', '/scenes/player/', '/scenes/enemies/', '/scenes/bosses/'
          ]
          refs = run('git', 'for-each-ref', '--format=%(refname:short)', 'refs/remotes/origin').stdout.splitlines()
          refs = [r for r in refs if r != 'origin/HEAD']
          branch_report = {}
          for ref in refs:
              paths = run('git', 'ls-tree', '-r', '--name-only', ref).stdout.splitlines()
              found = {}
              for suffix in target_suffixes:
                  found[suffix] = [p for p in paths if p == suffix or p.endswith('/' + suffix)]
              for fragment in dir_fragments:
                  key = fragment.strip('/') + '/'
                  found[key] = sorted({p.split(fragment)[0] + fragment.strip('/') + '/' for p in paths if fragment in '/' + p})
              hits = {k: v for k, v in found.items() if v}
              branch_report[ref] = {
                  'target_hits': hits,
                  'target_hit_count': sum(bool(v) for v in found.values()),
                  'complete_exact_file_set': all(found[s] for s in target_suffixes),
              }

          historical = [
              'ed9570e', '62be8b4', 'c229ccd', '9a418c3', 'e01f1dc',
              '94ed311', 'e3b38a9', '5259c0b', '52a2295'
          ]
          history_report = {}
          for sha in historical:
              p = run('git', 'cat-file', '-e', sha + '^{commit}', check=False)
              history_report[sha] = 'PRESENT' if p.returncode == 0 else 'ABSENT'

          old_branch = run('git', 'show-ref', '--verify', '--quiet', 'refs/remotes/origin/feat/godot-o-olho', check=False)
          report = {
              'remote_branches': refs,
              'feat_godot_o_olho': 'PRESENT' if old_branch.returncode == 0 else 'ABSENT',
              'historical_commits': history_report,
              'branches': branch_report,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Classify handoff package integrity without pretending restoration succeeded
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin handoff/chronica-godot-real-source-2026-09-07
          REF='origin/handoff/chronica-godot-real-source-2026-09-07'
          python - <<'PY'
          import base64
          import hashlib
          import json
          import re
          import subprocess

          ref = 'origin/handoff/chronica-godot-real-source-2026-09-07'
          packs = [
              'chronica-handoff/CHRONICA_HARUN_FRONT_B_SOURCE_MIN_2026-09-07.tar.gz.b64',
              'chronica-handoff/CHRONICA_HARUN_FRONT_B_SOURCE_MIN_v2_2026-09-07.tar.gz.b64',
          ]
          report = {}
          for path in packs:
              p = subprocess.run(['git', 'show', f'{ref}:{path}'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if p.returncode:
                  report[path] = {'status': 'missing'}
                  continue
              raw_text = p.stdout
              try:
                  text = raw_text.decode('ascii')
              except UnicodeDecodeError:
                  report[path] = {'status': 'non_ascii', 'bytes': len(raw_text)}
                  continue
              compact = ''.join(text.split())
              bad = sorted(set(re.sub(r'[A-Za-z0-9+/=]', '', compact)))
              item = {
                  'stored_bytes': len(raw_text),
                  'stored_sha256': hashlib.sha256(raw_text).hexdigest(),
                  'compact_length': len(compact),
                  'length_mod_4': len(compact) % 4,
                  'invalid_chars': bad,
                  'contains_ellipsis_marker': 'ELLIPSIZATION' in text,
              }
              if bad or len(compact) % 4:
                  item['status'] = 'CORRUPT_NOT_VALID_BASE64'
              else:
                  try:
                      decoded = base64.b64decode(compact, validate=True)
                      item['status'] = 'VALID_BASE64'
                      item['decoded_bytes'] = len(decoded)
                      item['decoded_sha256'] = hashlib.sha256(decoded).hexdigest()
                  except Exception as exc:
                      item['status'] = 'CORRUPT_BASE64_DECODE_ERROR'
                      item['decode_error'] = str(exc)
              report[path] = item
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Show directly exposed recovered project manifest
        shell: bash
        run: |
          set -euxo pipefail
          REF='origin/handoff/chronica-godot-real-source-2026-09-07'
          git cat-file -e "${REF}:chronica-handoff/source/project.godot"
          git show "${REF}:chronica-handoff/source/project.godot" | sed -n '1,220p'
