name: CHRONICA Final Integration Windows RC

on:
  workflow_dispatch:
  push:
    branches:
      - integration/chronica-final-v1

permissions:
  contents: read

env:
  GAME_DIR: game/chronica-harun

jobs:
  build-windows-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source identity
        shell: bash
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          echo "$HEAD" | tee /tmp/source-head.txt
          test "$HEAD" = "$GITHUB_SHA"
          git status --short
          echo RC_SOURCE_IDENTITY=PASS | tee /tmp/source-status.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source and resolve art
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest trimesh numpy

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('game/chronica-harun')
          specs = [
              (root / 'data/enemies/student_enemies.json', 82),
              (root / 'data/bosses/student_bosses.json', 16),
          ]

          referenced = []
          for path, expected in specs:
              rows = json.loads(path.read_text(encoding='utf-8'))
              if len(rows) != expected:
                  raise SystemExit(f'{path}: expected {expected} rows, got {len(rows)}')
              model_paths = [row.get('model_path', '') for row in rows]
              if any(not p.startswith('res://') for p in model_paths):
                  raise SystemExit(f'{path}: every model_path must be a res:// path')
              if len(set(model_paths)) != expected:
                  raise SystemExit(f'{path}: model_path values must be unique')
              referenced.extend(root / p.removeprefix('res://') for p in model_paths)

          present = [p for p in referenced if p.is_file()]
          if len(present) == len(referenced):
              mode = 'committed-art'
          elif not present:
              mode = 'placeholder-fallback'
          else:
              missing = [str(p) for p in referenced if not p.is_file()][:10]
              raise SystemExit(
                  'Partial art tree detected. Refusing to overwrite committed art with placeholders. '
                  f'Missing examples: {missing}'
              )

          Path('/tmp/asset-mode.txt').write_text(mode + '\n', encoding='utf-8')
          print(f'RC_ASSET_MODE={mode}')
          PY

          if [[ "$(cat /tmp/asset-mode.txt)" == "placeholder-fallback" ]]; then
            python "$GAME_DIR/tools/generate_models.py"
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('game/chronica-harun')
          specs = [
              (root / 'data/enemies/student_enemies.json', 82, 'enemy'),
              (root / 'data/bosses/student_bosses.json', 16, 'boss'),
          ]
          for path, expected, label in specs:
              rows = json.loads(path.read_text(encoding='utf-8'))
              if len(rows) != expected:
                  raise SystemExit(f'{label}: expected {expected} rows, got {len(rows)}')
              model_paths = [row['model_path'] for row in rows]
              if len(set(model_paths)) != expected:
                  raise SystemExit(f'{label}: duplicate model paths')
              missing = [p for p in model_paths if not (root / p.removeprefix('res://')).is_file()]
              if missing:
                  raise SystemExit(f'{label}: missing model files: {missing[:10]}')
              print(f'RC_{label.upper()}_MODELS={expected}')
          PY

          pytest -q "$GAME_DIR/tests" | tee /tmp/pytest.log
          python "$GAME_DIR/tools/validate_complete_game.py" | tee /tmp/complete.log
          python "$GAME_DIR/tools/validate_story_canon.py" | tee /tmp/story.log
          echo RC_SOURCE_VALIDATION=PASS | tee /tmp/source-validation-status.txt

      - name: Install Godot 4.3 and Windows templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          rm -rf /tmp/export_templates
          mkdir -p /tmp/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/export_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a /tmp/export_templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version | tee /tmp/godot-version.txt

      - name: Strict Godot import
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GAME_DIR" --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed' /tmp/import.log
          echo RC_IMPORT=PASS | tee /tmp/import-status.txt

      - name: Main boot smoke
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 12s godot --headless --path "$GAME_DIR" res://scenes/boot/Main.tscn 2>&1 | tee /tmp/boot.log
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" -ne 0 && "$code" -ne 124 ]]; then exit "$code"; fi
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed|Invalid call|Invalid access|Trying to assign value' /tmp/boot.log
          echo RC_BOOT=PASS | tee /tmp/boot-status.txt

      - name: Export Windows executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GAME_DIR/build/windows"
          godot --headless --path "$GAME_DIR" --export-release "Windows Desktop" build/windows/CHRONICA_HARUN.exe 2>&1 | tee /tmp/export.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Compilation failed|ERROR: Cannot export' /tmp/export.log
          test -s "$GAME_DIR/build/windows/CHRONICA_HARUN.exe"
          sha256sum "$GAME_DIR/build/windows/CHRONICA_HARUN.exe" | tee "$GAME_DIR/build/windows/CHRONICA_HARUN.exe.sha256"
          echo RC_WINDOWS_EXPORT=PASS | tee /tmp/export-status.txt

      - name: Package RC
        shell: bash
        run: |
          set -euo pipefail
          cd "$GAME_DIR/build/windows"
          zip -9 CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip CHRONICA_HARUN.exe CHRONICA_HARUN.exe.sha256
          test -s CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip
          sha256sum CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip | tee CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip.sha256
          ls -lh CHRONICA_HARUN.exe CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip
          echo RC_PACKAGE=PASS | tee /tmp/package-status.txt

      - name: Verification record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-rc
          HEAD=$(cat /tmp/source-head.txt)
          GODOT=$(cat /tmp/godot-version.txt)
          ASSET_MODE=$(cat /tmp/asset-mode.txt)
          EXE_SHA=$(cut -d' ' -f1 "$GAME_DIR/build/windows/CHRONICA_HARUN.exe.sha256")
          ZIP_SHA=$(cut -d' ' -f1 "$GAME_DIR/build/windows/CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip.sha256")
          cat > integration-rc/BUILD_VERIFIED.md <<EOF
          # CHRONICA HARUN · Integration Windows RC
          - Source HEAD: $HEAD
          - Godot: $GODOT
          - Asset mode: $ASSET_MODE
          - Python suite: PASS
          - Complete validator: PASS
          - Story validator: PASS
          - Import: PASS
          - Boot: PASS
          - Windows export: PASS
          - EXE SHA-256: $EXE_SHA
          - ZIP SHA-256: $ZIP_SHA
          EOF
          cat integration-rc/BUILD_VERIFIED.md

      - name: Final RC gate
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'RC_SOURCE_IDENTITY=PASS' /tmp/source-status.txt
          grep -qx 'RC_SOURCE_VALIDATION=PASS' /tmp/source-validation-status.txt
          grep -q 'passed' /tmp/pytest.log
          grep -q 'COMPLETE GAME VALIDATION: PASS' /tmp/complete.log
          grep -q 'CHRONICA STORY CANON VALIDATION: PASS' /tmp/story.log
          grep -qx 'RC_IMPORT=PASS' /tmp/import-status.txt
          grep -qx 'RC_BOOT=PASS' /tmp/boot-status.txt
          grep -qx 'RC_WINDOWS_EXPORT=PASS' /tmp/export-status.txt
          grep -qx 'RC_PACKAGE=PASS' /tmp/package-status.txt
          test -s "$GAME_DIR/build/windows/CHRONICA_HARUN.exe"
          test -s "$GAME_DIR/build/windows/CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip"
          echo CHRONICA_WINDOWS_INTEGRATION_RC=PASS

      - name: Upload verified Windows RC
        uses: actions/upload-artifact@v4
        with:
          name: CHRONICA_HARUN_WINDOWS_ALPHA_RC
          path: |
            game/chronica-harun/build/windows/CHRONICA_HARUN.exe
            game/chronica-harun/build/windows/CHRONICA_HARUN.exe.sha256
            game/chronica-harun/build/windows/CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip
            game/chronica-harun/build/windows/CHRONICA_HARUN_WINDOWS_ALPHA_RC.zip.sha256
            integration-rc/BUILD_VERIFIED.md
          if-no-files-found: error
          retention-days: 30
