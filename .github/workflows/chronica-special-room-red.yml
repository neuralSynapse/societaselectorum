name: CHRONICA Special Room Generation RED

on:
  workflow_dispatch:
  push:
    branches: [fix/chronica-runtime-qa]
    paths: ['.github/workflows/chronica-special-room-red.yml']

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chronica-runtime-qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Expected RED
        run: pytest -q game/chronica-harun/tests/test_special_room_generation_runtime_gate.py
